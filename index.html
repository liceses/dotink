<script>/* 防 FOUC：首帧之前就把主题定下来（规则与 theme.js 一致，别在这里加逻辑） */
(function(){try{
  var k='dotink.theme',v=localStorage.getItem(k),d=document.documentElement,pals=["original","night","newsprint","cyanotype","xerox","vermilion"];
  if(v&&pals.indexOf(v)<0)v=null;
  if(!v&&window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)v="night";
  if(v&&v!=="original")d.setAttribute('data-theme',v);
}catch(e){}})();</script>
<!-- site:boot:end -->
<noscript><meta http-equiv="refresh" content="0; url=hero.html"></noscript>
<link rel="canonical" href="hero.html">
<style>
  /* 只是一层跳转壳：配色仍走令牌，免得首帧闪一下旧纸色 */

  body{display:grid;place-items:center;
    font:500 var(--t-body) ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}
  a{color:var(--fg);text-underline-offset:3px}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
